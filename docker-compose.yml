services:
  tetopro-obra-postgres:
    image: postgres:16-alpine
    container_name: tetopro-obra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tetopro_obra
      POSTGRES_USER: tetopro_obra
      POSTGRES_PASSWORD: tetopro_obra
    ports:
      - "5432:5432"
    volumes:
      - tetopro_obra_postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetopro_obra"]
      interval: 5s
      timeout: 5s
      retries: 10

  tetopro-obra-mongo:
    image: mongo:7
    container_name: tetopro-obra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: tetopro_obra
      MONGO_INITDB_ROOT_PASSWORD: tetopro_obra
    ports:
      - "27017:27017"
    volumes:
      - tetopro_obra_mongo_dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  tetopro-obra-keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: tetopro-obra-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./backend/src/main/resources/keycloak:/opt/keycloak/data/import
      # Tema customizado (login + troca de senha) — "start-dev" já desliga o
      # cache de temas/templates sozinho, então editar os arquivos aqui reflete
      # só com um refresh da página, sem precisar reiniciar o container.
      - ./backend/src/main/resources/keycloak/themes/tetopro-obra:/opt/keycloak/themes/tetopro-obra
      - tetopro_obra_keycloak_dados:/opt/keycloak/data

