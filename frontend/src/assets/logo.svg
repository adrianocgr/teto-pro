<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TetoPro Obra">
  <!-- Selo quadrado (só o ícone — o texto "TetoPro" já é escrito em HTML ao lado
       dele, ver AppShell.tsx). Cores fixas, combinando com os tokens de marca
       e de dourado de global.css: o selo sempre aparece sobre a barra lateral,
       que é propositalmente escura nos dois temas. -->
  <rect x="8" y="8" width="144" height="144" rx="34" fill="#142140"/>

  <!-- Telhado (Teto) -->
  <path d="M 42 94 L 80 52 L 118 94" fill="none" stroke="#d9a441" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base/fundação -->
  <line x1="54" y1="114" x2="106" y2="114" stroke="#f8f4ea" stroke-width="9" stroke-linecap="round"/>
</svg>
