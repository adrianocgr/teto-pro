<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TetoPro Obra">
  <defs>
    <style>
      .wordmark { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .badge    { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- ===== MARCA: monograma T+P construído com formas geométricas (ligadura), selo O (Obra) ===== -->
  <g>
    <rect x="10" y="10" width="150" height="150" rx="30" fill="#14213D"/>

    <!-- Haste vertical compartilhada entre o T e o P -->
    <rect x="76" y="34" width="16" height="98" rx="6" fill="#FFFFFF"/>

    <!-- Travessa do T -->
    <rect x="40" y="34" width="88" height="16" rx="6" fill="#FFFFFF"/>

    <!-- Barriga do P, encaixada na haste -->
    <path d="M 92 54 H 110 A 24 24 0 0 1 110 102 H 92 Z" fill="#D9A441"/>

    <!-- Selo do módulo: O de Obra — troca por C (CRM) ou A (Aluguel) nos próximos módulos -->
    <circle cx="150" cy="148" r="22" fill="#E2793A" stroke="#FFFFFF" stroke-width="5"/>
    <text x="150" y="155" class="badge" font-size="20" fill="#FFFFFF" text-anchor="middle">O</text>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g>
    <text x="210" y="88" class="wordmark" font-size="52" fill="#14213D">Teto<tspan fill="#D9A441">Pro</tspan></text>

    <rect x="210" y="106" width="112" height="34" rx="17" fill="#E2793A"/>
    <text x="266" y="129" class="badge" font-size="17" fill="#FFFFFF" text-anchor="middle">OBRA</text>
  </g>
</svg>
