# Perfil de produção (Dokploy) — Postgres, MongoDB e Keycloak rodam em
# outro lugar (outros serviços já existentes), não neste compose. Por isso
# aqui só ficam valores que são realmente fixos em produção; credenciais e
# endereços de conexão (datasource, mongo) vêm inteiramente de variáveis de
# ambiente configuradas no Dokploy — ver docker-compose.prod.yml e
# .env.prod.example — e nem precisam ser citadas aqui: o Spring Boot já
# aplica SPRING_DATASOURCE_URL/USERNAME/PASSWORD e SPRING_DATA_MONGODB_URI
# automaticamente por convenção de nome.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.tetopro.com/realms/tetopro-obra

tetopro-obra:
  cors:
    origens-permitidas: https://tetopro.com,https://www.tetopro.com
  keycloak-admin:
    url: https://auth.tetopro.com

# Documentação da API não fica pública em produção (reduz superfície exposta).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    br.com.tetoproobra: INFO
    org.hibernate.SQL: WARN
