# =========================================================
# Stack de produção — só front e back. Postgres, MongoDB e Keycloak rodam
# em outro lugar (outro compose/servidor já existente) — esta app só
# precisa dos endereços/credenciais deles via variável de ambiente.
#
# Pensado pra ser importado como app "Compose" no Dokploy, que já cuida do
# proxy reverso (Traefik) e do certificado HTTPS (Let's Encrypt).
#
# Depois de importar, configure no painel do Dokploy um domínio pra cada
# um destes serviços (aponte o DNS de cada domínio pro servidor primeiro):
#   tetopro-obra-web   porta 80    -> tetopro.com (e www.tetopro.com)
#   tetopro-obra-api   porta 8080  -> api.tetopro.com
#
# O Keycloak (auth.tetopro.com) é provisionado separadamente, onde quer
# que os outros serviços já estejam rodando — importe lá o realm em
# backend/src/main/resources/keycloak/realm-tetopro-obra.json.
#
# Variáveis de ambiente obrigatórias (configure no Dokploy, nunca
# commitadas aqui) — ver .env.prod.example na raiz do repositório.
# =========================================================

services:
  tetopro-obra-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # JDBC — banco Postgres já existente, rodando em outro lugar.
      # (ex.: jdbc:postgresql://host:5432/tetopro_obra — ver .env.prod.example)
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?defina SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?defina SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?defina SPRING_DATASOURCE_PASSWORD}"
      # MongoDB já existente, rodando em outro lugar (ver .env.prod.example).
      SPRING_DATA_MONGODB_URI: "${SPRING_DATA_MONGODB_URI:?defina SPRING_DATA_MONGODB_URI}"
      # Precisa bater com o secret do client "tetopro-obra-backend" no realm do Keycloak.
      TETOPRO_OBRA_KEYCLOAK_ADMIN_SECRET: "${TETOPRO_OBRA_KEYCLOAK_ADMIN_SECRET:?defina TETOPRO_OBRA_KEYCLOAK_ADMIN_SECRET}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"

  tetopro-obra-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.tetopro.com
        VITE_KEYCLOAK_URL: https://auth.tetopro.com
        VITE_KEYCLOAK_REALM: tetopro-obra
        VITE_KEYCLOAK_CLIENT_ID: tetopro-obra-frontend
    restart: unless-stopped
    depends_on:
      - tetopro-obra-api
    expose:
      - "80"
